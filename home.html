<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Forca LIBRAS</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#3B82F6",
              "background-light": "#F3F4F6",
              "background-dark": "#1F2937",
              "card-light": "#FFFFFF",
              "card-dark": "#374151",
              "text-light": "#111827",
              "text-dark": "#F9FAFB",
              "text-secondary-light": "#6B7280",
              "text-secondary-dark": "#D1D5DB",
            },
            fontFamily: {
              display: ["Poppins", "sans-serif"],
            },
            borderRadius: {
              DEFAULT: "0.75rem",
            },
            backgroundImage: {
              "gradient-radial":
                "radial-gradient(ellipse at center, var(--tw-gradient-stops))",
            },
            boxShadow: {
              "inner-lg": "inset 0 2px 4px 0 rgba(0, 0, 0, 0.06)",
            },
          },
        },
      };
    </script>
  </head>
  <body
    class="font-display bg-background-light dark:bg-background-dark text-text-light dark:text-text-dark"
  >
    <div
      class="relative min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-indigo-500 via-purple-500 to-blue-500"
    >
      <div
        class="absolute top-0 -left-1/4 w-96 h-96 bg-blue-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob"
      ></div>
      <div
        class="absolute top-0 -right-1/4 w-96 h-96 bg-purple-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-2000"
      ></div>
      <div
        class="absolute -bottom-1/4 left-1/4 w-96 h-96 bg-indigo-300 rounded-full mix-blend-multiply filter blur-xl opacity-70 animate-blob animation-delay-4000"
      ></div>
      <main class="relative z-10 flex flex-col items-center w-full max-w-md">
        <header class="mb-12 flex items-center justify-center gap-4 text-white">
          <div class="bg-white/20 p-3 rounded-lg backdrop-blur-sm">
            <img
              alt="Forca LIBRAS logo"
              class="h-10 w-10"
              src="https://lh3.googleusercontent.com/aida-public/AB6AXuDuXknOPMYrFPV11OjALPRQjcuKLZI1zxQQLG2JSp94uXSWQmOqsYlOzjRO47GqqY-xqqgpyC_LzZb7f4ggBFxTXYOdY04jqlmCwuhAJ9jEt10GVAtYwH__b3lYXTIRQbI42B0yHcOdJPzX5inNYQNYK3TCnP8OX4NzrqZO-0vNAwjgR1fhMQc9saMSp2ujll2ApEVQOWof_XAje8ayi-faDqrY2JN9qUzNHuXIyf-DCORKmE-vJxNtj68koqXAjo7ve0YEspS7k-I"
            />
          </div>
          <h1 class="text-4xl font-bold tracking-wider">Forca LIBRAS</h1>
        </header>
        <div
          class="bg-card-light/80 dark:bg-card-dark/80 backdrop-blur-lg rounded-2xl shadow-2xl p-8 text-center w-full"
        >
          <div
            class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-primary/20 text-primary"
          >
            <span
              class="material-icons text-5xl"
              style="
                font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0,
                  'opsz' 48;
              "
            >
              sign_language
            </span>
          </div>
          <h2
            class="text-4xl font-bold text-text-light dark:text-text-dark mb-2"
          >
            Bem-vindo!
          </h2>
          <p
            class="text-text-secondary-light dark:text-text-secondary-dark mb-8"
          >
            Teste suas habilidades em LIBRAS e descubra as palavras! Junte-se a
            nós para aprender e se conectar com a comunidade surda.
          </p>
          <button
            class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-4 px-6 rounded-lg shadow-lg transform hover:scale-105 transition-transform duration-300 ease-in-out flex items-center justify-center gap-2"
          >
            <span class="material-icons"> play_arrow </span>
            Iniciar o jogo
          </button>
        </div>
      </main>
      <footer class="absolute bottom-4 left-4">
        <button
          class="bg-red-500 text-white text-sm py-1 px-3 rounded-full flex items-center gap-1 shadow-md hover:bg-red-600 transition-colors"
        >
          <span class="font-bold">N.</span>
          1 issue
          <span class="material-icons text-base">close</span>
        </button>
      </footer>
    </div>
    <style>
      .animate-blob {
        animation: blob 7s infinite;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }
      @keyframes blob {
        0% {
          transform: translate(0px, 0px) scale(1);
        }
        33% {
          transform: translate(30px, -50px) scale(1.1);
        }
        66% {
          transform: translate(-20px, 20px) scale(0.9);
        }
        100% {
          transform: translate(0px, 0px) scale(1);
        }
      }
    </style>
  </body>
</html>
